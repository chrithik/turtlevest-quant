services:
  web:
    build: .
    container_name: turtlevest-quant
    restart: always
    ports:
      - "8555:8501"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FMP_API_KEY=${FMP_API_KEY}
      - DEVELOPMENT_MODE=false # Set to true to allow pipeline scrapers and local model connections during testing
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    container_name: turtlevest-worker
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FMP_API_KEY=${FMP_API_KEY}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "run_scheduler.py"]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel-quant
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiOWI3MjIzMDQ1NWE1NDFhODgzZWRmMDFkNWYxODFlOTkiLCJ0IjoiMzVmZGYyNzEtNmIxYS00OGY4LTkwNTgtZDJmZTFmZjE5Nzc4IiwicyI6Ik0ySXdZV1EyWldNdE5UazJOeTAwT1dRNExXSXdNekV0WmpreVlUWTBaV1l4WXpGaiJ9
    depends_on:
      - web
